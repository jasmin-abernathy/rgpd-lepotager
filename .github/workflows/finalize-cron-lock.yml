name: Finalize cron lock path

on:
  push:
    branches:
      - fix/cron-overlap-guard
    paths:
      - .github/tmp/finalize-cron-lock.py
      - .github/workflows/finalize-cron-lock.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/cron-overlap-guard
          fetch-depth: 0
      - name: Apply final lock path
        run: python3 .github/tmp/finalize-cron-lock.py
      - name: Validate
        run: |
          php -l cron/update-prices.php
          grep -Fq "$lockPath=__DIR__.'/private/update-prices.lock';" cron/update-prices.php
          grep -Fq 'cron/private/update-prices.lock' .gitignore
          git diff --check
      - name: Commit
        run: |
          git config user.name 'Jasmin-potager'
          git config user.email 'jasmin@lepotager.org'
          git add cron/update-prices.php .gitignore
          git commit -m 'Place le verrou cron dans les données runtime'
          git push origin HEAD:fix/cron-overlap-guard
