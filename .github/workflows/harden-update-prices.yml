name: Harden update-prices cron

on:
  push:
    branches:
      - fix/cron-overlap-guard
    paths:
      - .github/tmp/harden-update-prices.py
      - .github/workflows/harden-update-prices.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/cron-overlap-guard
          fetch-depth: 0

      - name: Apply guarded transformation
        run: python3 .github/tmp/harden-update-prices.py

      - name: Validate PHP syntax
        run: php -l cron/update-prices.php

      - name: Validate safety guards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('cron/update-prices.php').read_text(encoding='utf-8')
          needles = [
              'LOCK_EX|LOCK_NB',
              'SKIP: update-prices already running',
              '$crawlBudgetSeconds=60;',
              "min(6,(int)$c['timeout_seconds'])",
              "'duration_seconds'=>",
          ]
          missing = [n for n in needles if n not in s]
          if missing:
              raise SystemExit('Missing cron guards: ' + ', '.join(missing))
          print('Cron guards present')
          PY
          git diff --check

      - name: Commit hardened cron
        run: |
          git config user.name 'Jasmin-potager'
          git config user.email 'jasmin@lepotager.org'
          git add cron/update-prices.php
          git commit -m 'Sécurise le cron contre les chevauchements et timeouts longs'
          git push origin HEAD:fix/cron-overlap-guard
